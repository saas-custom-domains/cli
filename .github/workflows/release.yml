name: Release

# Stages a new version on npm when a v* tag is pushed, for example v0.1.2. It goes live once a maintainer
# approves it with 2FA under Staged Packages on npmjs.com (or `npm stage approve <stage-id>`).
# Uses npm trusted publishing (OIDC) with stage-only permission: configure this repository and workflow as a
# trusted publisher for the package on npmjs.com, without allowing direct `npm publish`. See AGENTS.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # Lets a tag mark a version that was published by hand, such as a package's first version
      - name: Check whether this version is already on npm
        id: npm
        run: |
          if npm view "$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Staged publishing needs npm 11.15 or newer
      - run: npm install -g npm@latest
      # Trusted publishing adds provenance automatically
      - run: npm stage publish
        if: steps.npm.outputs.published != 'true'
